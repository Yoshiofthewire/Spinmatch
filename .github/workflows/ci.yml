name: CI

# Tests, client build, and (on PRs) the image build, so a Dockerfile mistake
# fails before merge rather than in docker-publish.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: docker-publish.yml is the only workflow that may publish.
permissions:
  contents: read

jobs:
  test:
    name: Server tests, client tests, and client build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Test the Node major the Dockerfile ships (Dependabot bumps it there).
      - name: Read Node version from Dockerfile
        id: node
        run: echo "major=$(grep -m1 -oP '^FROM node:\K[0-9]+' Dockerfile)" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.major }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # One fpcalc test runs the real binary to catch output-format changes.
      - name: Install Chromaprint (fpcalc)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libchromaprint-tools

      # No network: upstreams are MockAgent, yt-dlp is mocked at execFile.
      - name: Run server tests
        run: npm test

      - name: Run client tests
        run: npm run test:run -w client

      # Catches broken imports in files the tests never load.
      - name: Build the client
        run: npm run build

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    # On push to main docker-publish.yml builds it instead.
    if: github.event_name != 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          platforms: linux/amd64
          provenance: false
          sbom: false
          # YTDLP_VERSION unset: exercises the unpinned local-build path.
          cache-from: type=gha
          cache-to: type=gha,mode=max
