version: 2
updates:
  # The root lockfile covers both workspaces (server, client).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Must move together: a react/react-dom version split breaks rendering.
      react:
        patterns: ['react', 'react-dom']
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
